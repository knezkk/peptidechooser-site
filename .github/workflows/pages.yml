name: Deploy site
on:
  push:
    branches: [main]
  # once a day on main, so new prices from the database reach the site without a merge; the Tier 1 guard still stops
  # changed words (owner answer to block 43 Q1 a, 18 Nov 2026)
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One group per branch, so a branch run never touches a run on main. A newer run replaces an older one on a branch; on main nothing
# in progress is cancelled, the newer run waits (w1, 5 Nov 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # "Last updated" on /privacy/ and /disclosure/ is the last commit that changed their text
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: pull numbers from the peptide-data database (skipped until SITE_DATABASE_URL exists)
        env: { SITE_DATABASE_URL: "${{ secrets.SITE_DATABASE_URL }}" }
        run: |
          if [ -n "$SITE_DATABASE_URL" ]; then pip install -q "psycopg[binary]==3.2.3"; fi
          python3 tools/pull_data.py
      # the pages already live, so a comparison pair that is live stays (owner answer Q2 a, 3 Nov 2026)
      # since the sitemap index (task 23): every file of it, flat, and the live page dates, so an unchanged page keeps its date
      - name: fetch the live sitemap
        run: python3 tools/live_sitemap.py "$RUNNER_TEMP"
      # DEEP_LINK_CHECK: each plan deep link target is asked once; one that does not answer keeps the seller's home page,
      # listed in this step's log (queue block 44, 18 Nov 2026)
      - run: python3 tools/test_deep_links.py && python3 tools/test_successors.py && python3 tools/test_order_plans.py && python3 build.py
        env: { LIVE_SITEMAP: "${{ runner.temp }}/live-sitemap.xml", LIVE_LASTMOD: "${{ runner.temp }}/live-lastmod.json", LIVE_SELLER_ARCHIVE: "${{ runner.temp }}/live-seller-archive.json", DEEP_LINK_CHECK: "1" }
      # a page born from new data gets its share image here (owner answer Q1 a, 3 Nov 2026), then the site is rebuilt
      - name: draw missing share images
        env: { LIVE_SITEMAP: "${{ runner.temp }}/live-sitemap.xml", LIVE_LASTMOD: "${{ runner.temp }}/live-lastmod.json", LIVE_SELLER_ARCHIVE: "${{ runner.temp }}/live-seller-archive.json", DEEP_LINK_CHECK: "1" }
        run: |
          if [ "$(python3 tools/og.py --missing --count)" != "0" ]; then
            pip install -q playwright==1.49.1
            # browser only, from Playwright: no apt, no system font packages; the fonts are in tools/og-fonts (owner, 11 Nov 2026)
            python3 -m playwright install chromium >/dev/null
            python3 tools/og.py --missing
            python3 build.py
          fi
      # after the last build: the words of a title, description or H1 that differ from the live page stop the deploy without the owner's phrase, numbers and data-born pages pass;
      # the full list, old and new, stays in this step's log (owner answer to #94 Q2, 5 Nov 2026)
      - name: tier 1 guard
        run: |
          python3 tools/test_tier1_guard.py
          python3 tools/tier1_guard.py
      - name: check-words, check-seo, check-schema, check-parts
        env: { LIVE_SITEMAP: "${{ runner.temp }}/live-sitemap.xml" }
        run: python3 tools/check.py
      - name: check-layout
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          # browser only, no apt: the runner image already has Chromium's libraries (owner, 11 Nov 2026)
          npx playwright install chromium >/dev/null
          node tools/check_layout.js
      # the book's Lighthouse rule (layout.md): Home, /weight-loss/ and one seller page at 90 or more on all four categories
      - name: check-lighthouse
        run: |
          # all three together: npm i --no-save removes what an earlier --no-save installed (Playwright, from check-layout)
          npm i --no-save playwright@1.49.1 lighthouse@12.8.2 chrome-launcher@1 >/dev/null
          node tools/check_lighthouse.js
      # only main publishes: a branch run checks and builds, skips the publishing steps and stays green (owner, 5 Nov 2026)
      # the checked build as one artifact for deploy-cloudflare (GitHub Pages itself is off since 16 Nov 2026, owner "ajmo")
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  # The only host since 16 Nov 2026: Cloudflare Pages (queue block 5, step 4A). GitHub Pages was switched off a week after the
  # move (owner "ajmo", 16 Nov 2026), so a failure here is a failed deploy and turns the run red.
  deploy-cloudflare:
    needs: check-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets are set
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: github-pages, path: "${{ runner.temp }}/site" }
      - name: unpack the checked build
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/site/artifact.tar" -C dist && ls dist/_redirects dist/_headers dist/index.html
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptidechooser --branch=main
