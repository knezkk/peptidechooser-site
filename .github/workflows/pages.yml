name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One group per branch, so a branch run never touches a run on main. A newer run replaces an older one on a branch; on main nothing
# in progress is cancelled, the newer run waits (w1, 5 Nov 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # "Last updated" on /privacy/ and /disclosure/ is the last commit that changed their text
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: pull numbers from the peptide-data database (skipped until SITE_DATABASE_URL exists)
        env: { SITE_DATABASE_URL: "${{ secrets.SITE_DATABASE_URL }}" }
        run: |
          if [ -n "$SITE_DATABASE_URL" ]; then pip install -q "psycopg[binary]==3.2.3"; fi
          python3 tools/pull_data.py
      # the pages already live, so a comparison pair that is live stays (owner answer Q2 a, 3 Nov 2026)
      - name: fetch the live sitemap
        run: curl -sf https://peptidechooser.com/sitemap.xml -o "$RUNNER_TEMP/live-sitemap.xml" || true
      - run: python3 build.py
        env: { LIVE_SITEMAP: "${{ runner.temp }}/live-sitemap.xml" }
      # a page born from new data gets its share image here (owner answer Q1 a, 3 Nov 2026), then the site is rebuilt
      - name: draw missing share images
        env: { LIVE_SITEMAP: "${{ runner.temp }}/live-sitemap.xml" }
        run: |
          if [ "$(python3 tools/og.py --missing --count)" != "0" ]; then
            pip install -q playwright==1.49.1
            python3 -m playwright install --with-deps chromium >/dev/null
            python3 tools/og.py --missing
            python3 build.py
          fi
      # after the last build: the words of a title, description or H1 that differ from the live page stop the deploy without the owner's phrase, numbers and data-born pages pass;
      # the full list, old and new, stays in this step's log (owner answer to #94 Q2, 5 Nov 2026)
      - name: tier 1 guard
        run: |
          python3 tools/test_tier1_guard.py
          python3 tools/tier1_guard.py
      - name: check-words, check-seo, check-schema, check-parts
        run: python3 tools/check.py
      - name: check-layout
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node tools/check_layout.js
      # the book's Lighthouse rule (layout.md): Home, /weight-loss/ and one seller page at 90 or more on all four categories
      - name: check-lighthouse
        run: |
          # all three together: npm i --no-save removes what an earlier --no-save installed (Playwright, from check-layout)
          npm i --no-save playwright@1.49.1 lighthouse@12.8.2 chrome-launcher@1 >/dev/null
          node tools/check_lighthouse.js
      # only main publishes: a branch run checks and builds, skips the publishing steps and stays green (owner, 5 Nov 2026)
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: check-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # The new host, Cloudflare Pages (owner queue block 5, step 4A). The same checked build goes to the Cloudflare project too;
  # it skips until the owner adds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, and a failure here never stops
  # GitHub Pages, which keeps serving peptidechooser.com until the switch.
  deploy-cloudflare:
    needs: check-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { name: github-pages, path: "${{ runner.temp }}/site" }
      - name: unpack the checked build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: mkdir -p dist && tar -xf "$RUNNER_TEMP/site/artifact.tar" -C dist && ls dist/_redirects dist/_headers dist/index.html
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptidechooser --branch=main
